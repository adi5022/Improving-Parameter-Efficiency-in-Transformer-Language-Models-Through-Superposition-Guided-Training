<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="m-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="m-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/></marker>
    <marker id="m-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
    <marker id="m-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="m-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
  <style>
    text { fill: #111827; }
    .t { font-size: 14px; }
    .s { font-size: 13px; }
    .b { font-weight: 700; }
    .c { text-anchor: middle; }
    .panel-title { font-size: 15px; font-weight: 700; }
    .box { rx: 8; ry: 8; stroke-width: 1.8; }
  </style>

  <rect width="1500" height="1000" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="36" font-size="24" font-weight="700">Stage 2 architecture: SAE-measured overlap penalty on the toy model</text>
  <text x="30" y="60" font-size="14" fill="#374151" style="fill:#374151">Proposed design (decisions D-S2-1 to D-S2-10), not yet approved. The SAE only measures; the penalty is the only thing that changes training.</text>

  <!-- legend -->
  <line x1="30" y1="86" x2="55" y2="86" stroke="#2563eb" stroke-width="2.5"/><text x="62" y="91" class="s">forward data flow</text>
  <line x1="215" y1="86" x2="240" y2="86" stroke="#ea580c" stroke-width="2.5"/><text x="247" y="91" class="s">live path (gradient flows)</text>
  <line x1="440" y1="86" x2="465" y2="86" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 4"/><text x="472" y="91" class="s">detached copy (no gradient)</text>
  <line x1="680" y1="86" x2="705" y2="86" stroke="#dc2626" stroke-width="2.5"/><text x="712" y="91" class="s">gradient / update</text>
  <line x1="860" y1="86" x2="885" y2="86" stroke="#16a34a" stroke-width="2.5"/><text x="892" y="91" class="s">SAE</text>

  <!-- ===== PANEL 1 ===== -->
  <rect x="30" y="105" width="1010" height="190" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="45" y="128" class="panel-title">1  Model training pipeline (toy model, random start)</text>

  <rect class="box" x="50" y="150" width="200" height="105" fill="#ffffff" stroke="#2563eb"/>
  <text x="150" y="175" class="t b c">Synthetic data x</text>
  <text x="150" y="197" class="s c">1000 sparse features</text>
  <text x="150" y="217" class="s c">feature i on: prob ∝ 1/i</text>
  <text x="150" y="237" class="s c">value U(0,2), batch 2048</text>

  <rect class="box" x="290" y="150" width="200" height="105" fill="#ffffff" stroke="#2563eb"/>
  <text x="390" y="175" class="t b c">Hidden h = x·W</text>
  <text x="390" y="197" class="s c">m = 15 / 25 / 63 dimensions</text>
  <text x="390" y="217" class="s c">W: 1000 × m (the model)</text>
  <text x="390" y="237" class="s c">one arrow per feature</text>

  <rect class="box" x="530" y="150" width="240" height="105" fill="#ffffff" stroke="#2563eb"/>
  <text x="650" y="175" class="t b c">Output y = ReLU(h·Wᵀ + b)</text>
  <text x="650" y="197" class="s c">same W used again (tied)</text>
  <text x="650" y="217" class="s c">b: bias</text>

  <rect class="box" x="810" y="150" width="210" height="105" fill="#ffffff" stroke="#2563eb"/>
  <text x="915" y="175" class="t b c">Task loss</text>
  <text x="915" y="197" class="s c">MSE between y and x</text>
  <text x="915" y="217" class="s c">+ weight decay γ*</text>
  <text x="915" y="237" class="s c">(tuned per width)</text>

  <line x1="250" y1="202" x2="288" y2="202" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>
  <line x1="490" y1="202" x2="528" y2="202" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>
  <line x1="770" y1="202" x2="808" y2="202" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>

  <!-- ===== PANEL 2 ===== -->
  <rect x="30" y="310" width="1010" height="335" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="45" y="333" class="panel-title">2  SAE and penalty</text>

  <!-- detach h to SAE -->
  <line x1="340" y1="255" x2="340" y2="393" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-grey)"/>
  <text x="350" y="372" class="s" style="fill:#4b5563">detach(h): copy, no gradient</text>

  <!-- live path to penalty -->
  <path d="M470,255 V345 H887 V393" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#m-orange)"/>
  <text x="515" y="337" class="s" style="fill:#c2410c">ĥ = h / ‖h‖   (live: gradient flows)</text>

  <rect class="box" x="290" y="395" width="250" height="130" fill="#ffffff" stroke="#16a34a"/>
  <text x="415" y="418" class="t b c">Sparse autoencoder (SAE)</text>
  <text x="415" y="440" class="s c">encoder: h → latents z</text>
  <text x="415" y="460" class="s c">N = 1000 latents, BatchTopK, k ≈ 1</text>
  <text x="415" y="480" class="s c">decoder columns d_j</text>
  <text x="415" y="500" class="s c">trained every step, jointly</text>

  <rect class="box" x="565" y="395" width="180" height="130" fill="#ffffff" stroke="#6b7280" stroke-dasharray="6 4"/>
  <text x="655" y="418" class="t b c">SAE readings</text>
  <text x="655" y="438" class="s c">(all detached)</text>
  <text x="655" y="464" class="s c">active set S(h)</text>
  <text x="655" y="484" class="s c">unit directions d_j</text>
  <text x="655" y="504" class="s c">weights q_j (optional)</text>

  <rect class="box" x="785" y="395" width="205" height="130" fill="#ffffff" stroke="#ea580c"/>
  <text x="887" y="418" class="t b c">Leakage penalty</text>
  <text x="887" y="442" class="s c">λ · batch mean of</text>
  <text x="887" y="462" class="s c">Σ q_j (d_j · ĥ)²</text>
  <text x="887" y="482" class="s c">over latents j not in</text>
  <text x="887" y="502" class="s c">the active set S(h)</text>

  <line x1="540" y1="460" x2="563" y2="460" stroke="#16a34a" stroke-width="2.5" marker-end="url(#m-green)"/>
  <line x1="745" y1="460" x2="783" y2="460" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-grey)"/>

  <!-- SAE own loss -->
  <rect class="box" x="290" y="555" width="250" height="70" fill="#ffffff" stroke="#16a34a"/>
  <text x="415" y="578" class="s b c">SAE loss + its own optimiser</text>
  <text x="415" y="598" class="s c">reconstruction + sparsity</text>
  <text x="415" y="615" class="s c">own learning rate, every step</text>
  <line x1="360" y1="525" x2="360" y2="553" stroke="#16a34a" stroke-width="2.5" marker-end="url(#m-green)"/>
  <line x1="470" y1="555" x2="470" y2="527" stroke="#16a34a" stroke-width="2.5" marker-end="url(#m-green)"/>

  <!-- no gradient into SAE note -->
  <rect class="box" x="565" y="555" width="300" height="70" fill="#fef2f2" stroke="#dc2626"/>
  <text x="715" y="580" class="s b c" style="fill:#b91c1c">✕ No penalty gradient enters the SAE</text>
  <text x="715" y="601" class="s c">stop-gradient: the SAE cannot learn to</text>
  <text x="715" y="617" class="s c">report low overlap without having it</text>

  <!-- loop note -->
  <text x="50" y="430" class="s" style="fill:#1d4ed8">Loop: the updated W</text>
  <text x="50" y="448" class="s" style="fill:#1d4ed8">from panel 3 is used by</text>
  <text x="50" y="466" class="s" style="fill:#1d4ed8">the next step</text>

  <!-- ===== PANEL 3 ===== -->
  <rect x="30" y="660" width="1010" height="305" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="45" y="683" class="panel-title">3  Gradient pipeline (backward pass and update)</text>

  <rect class="box" x="720" y="695" width="270" height="75" fill="#ffffff" stroke="#dc2626"/>
  <text x="855" y="718" class="t b c">Penalty gradient</text>
  <text x="855" y="739" class="s c">λ · ∂leak/∂ĥ, chained back to W</text>
  <text x="855" y="757" class="s c">hand-written, checked against autograd</text>

  <rect class="box" x="720" y="790" width="270" height="60" fill="#ffffff" stroke="#dc2626"/>
  <text x="855" y="813" class="t b c">Task gradient</text>
  <text x="855" y="833" class="s c">∂(MSE + weight decay)/∂W</text>

  <rect class="box" x="380" y="715" width="260" height="110" fill="#ffffff" stroke="#dc2626"/>
  <text x="510" y="742" class="t b c">Add, then optimiser</text>
  <text x="510" y="765" class="s c">task grad + penalty grad</text>
  <text x="510" y="785" class="s c">Adam, per-run λ, fp32</text>
  <text x="510" y="805" class="s c">(penalty added before Adam)</text>

  <rect class="box" x="50" y="715" width="240" height="110" fill="#ffffff" stroke="#dc2626"/>
  <text x="170" y="742" class="t b c">W is updated</text>
  <text x="170" y="765" class="s c">this is where the model learns</text>
  <text x="170" y="785" class="s c">the SAE is never part of this</text>
  <text x="170" y="805" class="s c">weight update</text>

  <line x1="720" y1="732" x2="642" y2="748" stroke="#dc2626" stroke-width="2.5" marker-end="url(#m-red)"/>
  <line x1="720" y1="820" x2="642" y2="800" stroke="#dc2626" stroke-width="2.5" marker-end="url(#m-red)"/>
  <line x1="380" y1="770" x2="292" y2="770" stroke="#dc2626" stroke-width="2.5" marker-end="url(#m-red)"/>

  <!-- penalty value into penalty gradient -->
  <line x1="887" y1="525" x2="887" y2="693" stroke="#ea580c" stroke-width="2.5" marker-end="url(#m-orange)"/>

  <!-- task loss down the right edge into task gradient -->
  <path d="M1005,255 V820 H992" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#m-red)"/>
  <text x="1021" y="560" class="s" transform="rotate(-90 1021 560)" style="fill:#b91c1c">task loss, backward</text>

  <!-- loop W back to hidden -->
  <path d="M265,715 V285 H305 V258" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#m-blue)"/>

  <!-- key point box -->
  <rect class="box" x="50" y="868" width="940" height="88" fill="#ffffff" stroke="#dc2626"/>
  <text x="65" y="891" class="s b">Stop-gradient rule</text>
  <text x="65" y="911" class="s">Inside the penalty, the SAE's directions d_j, active set S(h) and weights q_j are constants.</text>
  <text x="65" y="929" class="s">The penalty gradient reaches the model only through ĥ = h/‖h‖, so shrinking activations does not lower it.</text>
  <text x="65" y="947" class="s">The SAE gets no penalty gradient, so it cannot game the penalty (Goodhart guard, decision D-09).</text>

  <!-- ===== PANEL 4 ===== -->
  <rect x="1070" y="105" width="400" height="410" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1085" y="128" class="panel-title">4  Independent ruler (read-only)</text>
  <line x1="1020" y1="175" x2="1088" y2="175" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-grey)"/>

  <rect class="box" x="1090" y="150" width="360" height="70" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1270" y="175" class="t b c">Test error vs L*(m)</text>
  <text x="1270" y="198" class="s c">fixed test set, 10-seed baseline</text>

  <rect class="box" x="1090" y="232" width="360" height="70" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1270" y="257" class="t b c">True overlap M_true of the W rows</text>
  <text x="1270" y="280" class="s c">toy only: we know the true feature arrows</text>

  <rect class="box" x="1090" y="314" width="360" height="70" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1270" y="339" class="t b c">SAE's own reading M_dec (in the loop)</text>
  <text x="1270" y="362" class="s c">can drift; reported, not trusted</text>

  <rect class="box" x="1090" y="396" width="360" height="70" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1270" y="421" class="t b c">Fresh SAEs on saved checkpoints</text>
  <text x="1270" y="444" class="s c">other seeds, every 2,500 steps and at the end</text>

  <text x="1270" y="494" class="s b c">Claims use test error and true overlap only.</text>

  <!-- ===== PANEL 5 ===== -->
  <rect x="1070" y="530" width="400" height="435" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="1085" y="553" class="panel-title">5  Run protocol and controls</text>
  <g class="s">
    <text x="1085" y="580" class="b">Each training step</text>
    <text x="1085" y="600">1  model forward (h = x·W)</text>
    <text x="1085" y="620">2  SAE takes a step on detached h</text>
    <text x="1085" y="640">3  penalty computed from the updated SAE</text>
    <text x="1085" y="660">4  model step: task gradient + λ · penalty</text>
    <text x="1085" y="682">λ = 0 until the SAE reconstructs well,</text>
    <text x="1085" y="700">then it is ramped in.</text>

    <text x="1085" y="732" class="b">Controls (same widths, seeds, tuning)</text>
    <text x="1085" y="752">• Baseline: tuned weight decay γ*</text>
    <text x="1085" y="772">• ORA-L: true directions, no SAE (ceiling)</text>
    <text x="1085" y="792">• RND-L: SAE directions randomly rotated</text>
    <text x="1085" y="812">• FRZ-L: SAE frozen after one fit</text>
    <text x="1085" y="832">• BCOH: SAE-free batch-coherence penalty</text>

    <text x="1085" y="866" class="b">Test plan</text>
    <text x="1085" y="886">Widths 15, 25, 63. λ chosen on seeds 0–2,</text>
    <text x="1085" y="904">judged on seeds 3–9 against the baseline.</text>

    <text x="1085" y="940" class="b" style="fill:#b45309">All settings are proposals, not approved.</text>
  </g>
</svg>
